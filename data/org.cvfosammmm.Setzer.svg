<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <title>LaTeX Editor</title>
  <defs>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="sqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc8add"/>
      <stop offset="1" stop-color="#813d9c"/>
    </linearGradient>
    <clipPath id="circClip">
      <!-- 正面圆：cy=62 -->
      <circle cx="46" cy="62" r="40"/>
    </clipPath>
    <!-- 圆形厚度 clip（下移4px的圆 + 中间4px厚度填充带） -->
    <clipPath id="circThickClip">
      <circle cx="46" cy="66" r="40"/>
      <rect x="6" y="62" width="80" height="4"/>
    </clipPath>
  </defs>
  <g transform="matrix(1.1743119266055047 0 0 1.1743119266055047 -7.045871559633028 -11.155963302752298)">


  <!-- ====== Layer 0: 圆形厚度 ====== -->
  <circle cx="46" cy="66" r="40" fill="#1a5fb4"/>
  <rect x="6" y="62" width="80" height="4" fill="#1a5fb4"/>

  <!-- ====== Layer 1: 方形厚度 ====== -->
  <rect x="55" y="36" width="60" height="60" rx="4" ry="4" fill="#613583"/>

  <!-- ====== Layer 2: 圆厚 × 方厚（最暗） ====== -->
  <g clip-path="url(#circThickClip)">
    <rect x="55" y="36" width="60" height="60" rx="4" ry="4" fill="#c64600"/>
  </g>

  <!-- ====== Layer 3: 圆形正面 ====== -->
  <circle cx="46" cy="62" r="40" fill="url(#circGrad)"/>

  <!-- ====== Layer 4: 圆面 × 方厚（中暗） ====== -->
  <g clip-path="url(#circClip)">
    <rect x="55" y="36" width="60" height="60" rx="4" ry="4" fill="#e66100"/>
  </g>

  <!-- ====== Layer 5: 方形正面 ====== -->
  <rect x="55" y="32" width="60" height="60" rx="4" ry="4" fill="url(#sqGrad)"/>

  <!-- ====== Layer 6: 圆厚 × 方面（中暗） ====== -->
  <g clip-path="url(#circThickClip)">
    <rect x="55" y="32" width="60" height="60" rx="4" ry="4" fill="#e66100"/>
  </g>

  <!-- ====== Layer 7: 圆面 × 方面（最亮） ====== -->
  <g clip-path="url(#circClip)">
    <rect x="55" y="32" width="60" height="60" rx="4" ry="4" fill="#ff7800"/>
  </g>

  <!-- ====== Layer 8: 装饰元素 ====== -->
  <!-- 阴影菱形（下移 4px），rx=4 满足 2px 限制 -->
  <rect x="38" y="56" width="16" height="16" rx="4" ry="4" fill="#ffa348" transform="rotate(45, 46, 64)"/>

  <!-- 正面菱形 -->
  <rect x="38" y="54" width="16" height="16" rx="4" ry="4" fill="#f6d32d" transform="rotate(45, 46, 62)"/>

  <!-- TeX logo (不受 2px 最小限制影响) -->
  <text x="85" y="62" fill="white" fill-opacity="0.92" dominant-baseline="central"
        font-family="'STIX Two Text', 'DejaVu Serif', 'Noto Serif', serif"
        font-size="22" font-weight="bold" text-anchor="middle">
    T<tspan font-size="16">E</tspan>X
  </text>
  </g>
</svg>
