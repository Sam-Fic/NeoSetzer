<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="392 395 1215 1245" fill="none">
  <defs>
    <linearGradient id="spine" x1="0" y1="395" x2="0" y2="1480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#241f31"/>
      <stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
    <linearGradient id="globalGradient" x1="1660" y1="1386" x2="969" y2="2077" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <!-- 装饰形状的不透明度渐变（颜色取自书籍配色） -->
    <!-- 三角：上方完全不透明 -> 下方完全透明 -->
    <linearGradient id="triFade" x1="0" y1="521.0" x2="0" y2="971.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5c64" stop-opacity="1"/>
      <stop offset="1" stop-color="#5e5c64" stop-opacity="0.2"/>
    </linearGradient>
    <!-- 圆：上方完全透明 -> 下方完全不透明 -->
    <linearGradient id="discFade" x1="0" y1="807.1" x2="0" y2="1193.3" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5c64" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5e5c64" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <!-- 整体围绕内容中心缩小到 93%，画布保持 128×128。
       注意：全图刻意不使用 clipPath/mask。DMS (quickshell) 的 Dock 用 QtSvg 渲染图标，
       而 QtSvg 不支持裁剪，会把遮蔽关系整个画穿。所有"被裁剪"的形状都直接写成
       几何等价的显式 path，librsvg（GNOME）与 QtSvg（DMS）渲染结果一致。 -->
  <g transform="translate(1000 1017.5) scale(0.93) translate(-1000 -1017.5)">
    <!-- 封面：圆角矩形提供顶部圆角，下方矩形盖平底部两角 -->
    <rect x="400" y="395" width="1200" height="955" rx="163" fill="#241f31"/>
    <rect x="400" y="558" width="1200" height="792" fill="#241f31"/>
    <!-- 书脊：左半圆盘（圆心 563,558 r=163，取 x<=563 一半）+ 矩形主体，
         两者同渐变、在 x=563 处拼合 -->
    <path d="M563 395 A163 163 0 0 0 563 721 Z" fill="url(#spine)"/>
    <rect x="400" y="558" width="163" height="922" fill="url(#spine)"/>
    <!-- 装饰几何：左上三角 + 右下圆，两者右下/左上部分重叠，都垫在 Σ 之下 -->
    <polygon points="944.7,521.0 1204.7,971.4 684.7,971.4" fill="url(#triFade)"/>
    <circle cx="1200.3" cy="1000.2" r="193.05" fill="url(#discFade)"/>
    <!-- Sigma -->
    <path transform="translate(464.3 377.7) scale(9.4)" d="M98.94 26.57H29.06L51.3 52.42 28.96 78.06H98.94V61.21H86.45L86.24 69.38H53.51L69.14 52.32 53.72 35.15H86.35L86.56 42.6H98.83Z" fill="#ffffff"/>
    <!-- 灰色内衬书页：8 条横条纹暗示书页厚度（必须画在黑色外框之前，让外框压住书页边缘）。
         条纹左端溢出与上下溢出分别垫在黑环和横杠之下，右端则逐条沿凹弧收边——
         凹弧取圆心 (1583.183,1477) r=93 的左侧弧段，与原书页外接形状的右端完全同圆，
         因此不再需要 clipPath -->
    <g>
      <!-- 书页外接形状（原 pagesClip 主子路径）：白色垫底，兜住条纹弧端的子像素接缝 -->
      <path d="M1564 1386 H563 A91 91 0 0 0 563 1568 H1564 A93 93 0 0 1 1564 1386 Z" fill="#ffffff"/>
      <!-- 搭接区（原 pagesClip 第二子路径）：书页再向外多铺一点（左半圆 r=105 落在黑框
           r∈[91,163] 的环内），让黑环内缘的抗锯齿边压在实白上，避免浅色接缝 -->
      <path d="M1485 1372 H563 A105 105 0 0 0 563 1582 H1485 Z" fill="#ffffff"/>
      <path d="M460 1386 H1564 A93 93 0 0 0 1520.009 1408.75 H460 Z" fill="#ffffff"/>
      <path d="M460 1408.75 H1520.009 A93 93 0 0 0 1502.074 1431.5 H460 Z" fill="url(#globalGradient)"/>
      <path d="M460 1431.5 H1502.074 A93 93 0 0 0 1493.009 1454.25 H460 Z" fill="#ffffff"/>
      <path d="M460 1454.25 H1493.009 A93 93 0 0 0 1490.183 1477 H460 Z" fill="url(#globalGradient)"/>
      <path d="M460 1477 H1490.183 A93 93 0 0 0 1493.009 1499.75 H460 Z" fill="#ffffff"/>
      <path d="M460 1499.75 H1493.009 A93 93 0 0 0 1502.074 1522.5 H460 Z" fill="url(#globalGradient)"/>
      <path d="M460 1522.5 H1502.074 A93 93 0 0 0 1520.009 1545.25 H460 Z" fill="#ffffff"/>
      <path d="M460 1545.25 H1520.009 A93 93 0 0 0 1564 1568 H460 Z" fill="url(#globalGradient)"/>
    </g>
    <!-- 黑色 C 形书页外框：两条横杠（圆帽）+ 左半圆环。
         半圆环写成显式填充 path（外缘 r=163、内缘 r=91，圆心 563,1477，取 x<=563 一半），
         几何上与原"整圆描边 72 + 裁剪"完全等价；切口处与上下横杠的黑体拼合 -->
    <g fill="none" stroke="#000000" stroke-width="72" stroke-linecap="round">
      <line x1="1564" y1="1350" x2="563" y2="1350"/>
      <line x1="1564" y1="1604" x2="563" y2="1604"/>
    </g>
    <path d="M563 1314 A163 163 0 0 0 563 1640 L563 1568 A91 91 0 0 1 563 1386 Z" fill="#000000"/>
  </g>
</svg>
