<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
  <title>LaTeX Editor</title>
  <defs>
    <linearGradient id="circGrad" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#99c1f1"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="sqGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dc8add"/>
      <stop offset="1" stop-color="#813d9c"/>
    </linearGradient>
    <clipPath id="circClip">
      <circle cx="201" cy="256" r="120"/>
    </clipPath>
    <!-- 圆形厚度 clip（下移14px的圆 + 中间填充带） -->
    <clipPath id="circThickClip">
      <circle cx="201" cy="270" r="120"/>
      <rect x="81" y="256" width="240" height="14"/>
    </clipPath>
  </defs>

  <g transform="translate(256,256) scale(1.3) translate(-256,-256)">

    <!-- ====== Layer 0: 圆形厚度 ====== -->
  <circle cx="201" cy="270" r="120" fill="#1a5fb4"/>
  <!-- Circle: shadow fill — left/right gap between face and shadow -->
  <rect x="81" y="256" width="240" height="14" fill="#1a5fb4"/>
  <!-- Circle: face -->
  <circle cx="201" cy="256" r="120" fill="url(#circGrad)"/>

    <!-- ====== Layer 1: 方形厚度 ====== -->
  <rect x="251" y="180" width="180" height="180" rx="10" ry="10" fill="#613583"/>

    <!-- ====== Layer 2: 圆厚 × 方厚（最暗） ====== -->
    <g clip-path="url(#circThickClip)">
      <rect x="251" y="180" width="180" height="180" rx="10" ry="10"
            fill="#c64600"/>
  </g>

    <!-- ====== Layer 3: 圆形正面 ====== -->
    <circle cx="201" cy="256" r="120" fill="url(#circGrad)"/>

    <!-- ====== Layer 4: 圆面 × 方厚（中暗） ====== -->
  <g clip-path="url(#circClip)">
    <rect x="251" y="180" width="180" height="180" rx="10" ry="10"
            fill="#e66100"/>
  </g>

    <!-- ====== Layer 5: 方形正面 ====== -->
    <rect x="251" y="166" width="180" height="180" rx="10" ry="10" fill="url(#sqGrad)"/>

    <!-- ====== Layer 6: 圆厚 × 方面（中暗） ====== -->
  <g clip-path="url(#circThickClip)">
    <rect x="251" y="166" width="180" height="180" rx="10" ry="10"
            fill="#e66100"/>
  </g>

    <!-- ====== Layer 7: 圆面 × 方面（最亮） ====== -->
    <g clip-path="url(#circClip)">
      <rect x="251" y="166" width="180" height="180" rx="10" ry="10"
            fill="#ff7800"/>
  </g>

    <!-- ====== Layer 8: 装饰元素 ====== -->
  <rect x="181" y="243" width="40" height="40" rx="6" ry="6"
        fill="#ffa348" transform="rotate(45,201,263)"/>
  <!-- Diamond shadow fill — left/right gap between face and shadow -->
  <rect x="175.201" y="256" width="51.598" height="7" fill="#ffa348"/>
  <rect x="181" y="236" width="40" height="40" rx="6" ry="6"
        fill="#f6d32d" transform="rotate(45,201,256)"/>

  <!-- TeX logo, auto-centered by browser (square center x=341, y=256) -->
  <text x="341" y="275" fill="white" fill-opacity="0.92"
        font-family="'STIX Two Text', 'DejaVu Serif', 'Noto Serif', serif"
        font-size="54" font-weight="bold" text-anchor="middle">
    T<tspan font-size="38">E</tspan>X
  </text>
</g>
</svg>
