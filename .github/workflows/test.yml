---
name: Run unit tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            meson \
            ninja-build \
            gettext \
            python3-gi \
            python3-cairo \
            python3-gi-cairo \
            python3-numpy \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-gtksource-5 \
            gir1.2-pango-1.0 \
            gir1.2-poppler-0.18 \
            gir1.2-webkit-6.0 \
            gir1.2-xdp-1.0

      - name: Install Python dependencies
        run: pip install polib

      - name: Configure project
        run: meson setup builddir --prefix=/usr --buildtype=debug

      - name: Verify translation files
        run: ./po/sync-po.sh --check

      - name: Run unit tests
        run: meson test -C builddir --print-errorlogs
